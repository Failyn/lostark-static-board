name: Refresh character stats

# Started once a day by the Supabase timer (timer.sql, with scheduled=true), or by hand:
# Actions tab -> "Refresh character stats" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by the daily timer: skip if stats are under 20 hours old"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read lostark.bible rosters and save them to the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCHEDULED: ${{ inputs.scheduled == 'true' && '1' || '0' }}
        run: python3 scripts/refresh.py
