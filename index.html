<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Static Board</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* layout: tabbed tool. Board = raid blocks as party × player grid (or party cards); Roster = 8 player columns; Schedule = days × players */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e9ecf1; --ink:#1b2130; --muted:#5b6472; --line:#d8dde4;
  --accent:#0d7a89; --accent-2:#a8791f; --good:#187a4f; --bad:#b8382f; --warn:#b06a12; --g2:rgba(13,122,137,.07);
  --badge-s:52%; --badge-l:38%; --chip:#232a38; --syn-sup:#6aa84f; --syn-crit:#4a86e8; --syn-amp:#45818e; --syn-back:#e0ac1c; --syn-ab:#e69138; --syn-camp:#674ea7; --hm:#c2621a; --nm:#7a4cc2; --c3:#b0505a; --nr:#3f7fae; --yb:#a8860a; --bb:#2f7fb8;
  --display:"Zilla Slab",Georgia,serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --surface:#171b24; --surface-2:#1f2430; --ink:#e8ebf1; --muted:#8b93a3; --line:#2a3040;
    --accent:#4fd1d9; --accent-2:#d9a94a; --good:#4caf7d; --bad:#e2685f; --warn:#e0a14f; --g2:rgba(79,209,217,.07);
    --badge-s:62%; --badge-l:66%; --chip:#262d3c; --syn-sup:#7cc25e; --syn-crit:#6a9ff0; --syn-amp:#5fa3b0; --syn-back:#f1c232; --syn-ab:#f0a050; --syn-camp:#9b84dc; --hm:#e0823a; --nm:#a07ae6; --c3:#e0868e; --nr:#7fb3dc; --yb:#e8c84e; --bb:#6cb8e6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#171b24; --surface-2:#1f2430; --ink:#e8ebf1; --muted:#8b93a3; --line:#2a3040;
  --accent:#4fd1d9; --accent-2:#d9a94a; --good:#4caf7d; --bad:#e2685f; --warn:#e0a14f; --g2:rgba(79,209,217,.07);
  --badge-s:62%; --badge-l:66%; --chip:#262d3c; --syn-sup:#7cc25e; --syn-crit:#6a9ff0; --syn-amp:#5fa3b0; --syn-back:#f1c232; --syn-ab:#f0a050; --syn-camp:#9b84dc; --hm:#e0823a; --nm:#a07ae6; --c3:#e0868e; --nr:#7fb3dc; --yb:#e8c84e; --bb:#6cb8e6; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.4;font-size:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in,.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{padding-block:10px 0;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.topbar h1{font-size:1.25rem;padding-bottom:9px}
.tabs{display:flex;gap:18px}
.tabbtn{font-family:var(--mono);font-size:.78rem;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:8px 2px}
.tabbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:8px;flex-wrap:wrap}
.chipbtn{font-family:var(--mono);font-size:.68rem;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
.chipbtn:hover{color:var(--accent);border-color:var(--accent)}
.chipbtn.on{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.seg button{font-family:var(--mono);font-size:.68rem;background:var(--surface-2);border:none;padding:3px 10px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--bg)}
.wrap{padding-block:16px 60px}
.stamp{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
#lockform{display:inline-flex;gap:4px;align-items:center}
#passin{width:110px;font-size:.74rem;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
#passin:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.82rem;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* week strip */
.week{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.wk .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wk .v{font-family:var(--display);font-weight:600;font-size:1.05rem}
.wk .v small{font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);margin-left:4px}
.wk .bar{height:3px;background:var(--surface-2);border-radius:2px;margin-top:4px;overflow:hidden}
.wk .bar i{display:block;height:100%;background:var(--good)}
.wk.next{border-left:3px solid var(--accent-2)}

/* blocks */
.block{margin-bottom:22px}
.block-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.block-h h2{font-size:1.2rem}
.block-h .meta{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.block-h .meta b{color:var(--ink);font-weight:500}
.block-h select{font-family:var(--mono);font-size:.72rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}

/* grid view */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.g{border-collapse:collapse;width:100%;min-width:640px}
table.g th{font-family:var(--display);font-weight:600;font-size:.9rem;text-align:left;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.g th.r,table.g td.r{text-align:right}
table.g th.c,table.g td.c{text-align:center}
table.g td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle;height:40px}
table.g tr:last-child td{border-bottom:none}
table.g td.artc{padding:3px 6px;width:1%}
table.g th.hd,table.g td.hd{width:30px;padding:0;text-align:center}
.grip{display:inline-grid;place-items:center;width:24px;height:30px;cursor:grab;color:var(--muted);touch-action:none;user-select:none;border-radius:5px;font-size:1rem}
.grip:hover{color:var(--accent);background:var(--surface-2)}
tr.dragging td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr.dragging .grip{cursor:grabbing}
tr.drop-above td{box-shadow:inset 0 3px 0 var(--accent)}
tr.drop-below td{box-shadow:inset 0 -3px 0 var(--accent)}
.del{width:24px;height:24px;border:1px solid transparent;border-radius:5px;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:0}
.del:hover{color:var(--bad);border-color:var(--line)}
.del.arm{width:auto;padding:0 5px;font-size:.62rem;font-family:var(--mono);color:var(--surface);background:var(--bad);border-color:var(--bad)}
.addrow{margin-top:6px;width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:7px;color:var(--muted);font-family:var(--mono);font-size:.74rem}
.addrow:hover{color:var(--accent);border-color:var(--accent)}
table.g.fixed.editing th.hd{width:30px}
table.g.fixed.editing th:first-child{width:30px}
table.g.fixed.editing th:nth-child(2){width:84px}
table.g.fixed{table-layout:fixed;min-width:1040px}
table.g.fixed th:first-child{width:84px}
table.g.fixed th:last-child{width:52px}
table.g.fixed.editing th:last-child{width:58px}
table.g.fixed.editing th:nth-last-child(2){width:52px}
.art{position:relative;display:block;width:calc(var(--n,1) * 62px + 8px);height:40px;border:none;border-radius:6px;overflow:hidden;padding:0;background:var(--surface-2)}
.art:disabled{cursor:default}
.edit .art:not(:disabled):hover{outline:2px solid var(--accent)}
.art .strip{position:absolute;inset:0;display:flex}
.art .strip i{flex:1;background-size:cover;background-position:center 30%}
.art .strip i + i{border-left:1px solid rgba(0,0,0,.5)}
.art .pid{position:absolute;left:5px;bottom:3px;font-family:var(--mono);font-size:.68rem;font-weight:500;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.art .tags{position:absolute;right:4px;top:4px;display:flex;gap:3px}
.tag{font-family:var(--mono);font-size:.58rem;font-weight:500;padding:0 4px;border-radius:4px;color:#fff;line-height:1.5}
.tag.hm{background:var(--hm)}.tag.nm{background:var(--nm)}.tag.c3{background:var(--c3)}
.tone{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.tone.hm{background:var(--hm)}.tone.nm{background:var(--nm)}.tone.c3{background:var(--c3)}.tone.nr{background:var(--nr)}
table.g tr.done td:not(.ck){opacity:.38}
.cell{display:flex;align-items:center;gap:8px;width:100%;height:100%;min-height:40px;padding:4px 8px;background:none;border:none;border-left:1px solid var(--line);text-align:left;min-width:0}
.cell.g2{background:var(--g2)}
.cell:disabled{cursor:default}
.edit .cell:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cell .tx{min-width:0;display:flex;flex-direction:column;line-height:1.15;flex:1}
.cell .nm{font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .sub{display:flex;gap:7px;font-size:.72rem;font-variant-numeric:tabular-nums}
.cell .sub .il{font-size:.72rem;color:var(--muted)}
.cell .sub .il.low{color:var(--bad);font-weight:700}
.cell .cp{color:var(--accent-2)}
table.g.fixed .cell{padding:4px 6px;gap:6px}
table.g.fixed .cell .nm{font-size:.8rem}
.ic{width:26px;height:26px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 2px var(--sc,var(--line))}
.ic.s-sup{--sc:var(--syn-sup)}.ic.s-crit{--sc:var(--syn-crit)}.ic.s-amp{--sc:var(--syn-amp)}.ic.s-back{--sc:var(--syn-back)}.ic.s-camp{--sc:var(--syn-camp)}.ic.s-ab{--sc:var(--syn-ab)}
.ic img{width:22px;height:22px;display:block}
.ic.sm{width:20px;height:20px}.ic.sm img{width:17px;height:17px}
.ic.lg{width:32px;height:32px}.ic.lg img{width:27px;height:27px}
.cell .il{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.cell .il.low{color:var(--bad);font-weight:600}
sup.alt{font-family:var(--mono);font-size:.56rem;font-weight:500;color:var(--accent);margin-left:1px;vertical-align:.45em;line-height:0}
.sup{display:inline-block;width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--accent-2);margin-left:5px;vertical-align:1px}
.cell.empty{color:var(--muted);font-family:var(--mono);font-size:.7rem;justify-content:center}
.ckw{display:flex;gap:4px;justify-content:center;padding:0 8px}
.ck button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:.62rem;color:var(--muted);display:grid;place-items:center;padding:0}
.ck button{width:auto;min-width:26px;padding:0 4px}
.ck button.hm{border-color:var(--hm);color:var(--hm)}.ck button.nm{border-color:var(--nm);color:var(--nm)}.ck button.c3{border-color:var(--c3);color:var(--c3)}.ck button.nr{border-color:var(--nr);color:var(--nr)}
.ck button.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.ck button:disabled{cursor:default}

/* roster */
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.pgroup{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.pname{display:flex;justify-content:space-between;align-items:baseline;padding:5px 10px;background:var(--surface-2);font-family:var(--display);font-weight:600;font-size:.98rem}
.pname small{font-family:var(--mono);font-size:.62rem;color:var(--muted);font-weight:400}
.rrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto 14px;gap:8px;align-items:center;padding:3px 10px;border-top:1px solid var(--line);font-size:.78rem}
.pname + .rrow{border-top:none}
.rrow .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rrow .rn small{font-weight:400;color:var(--muted);font-size:.68rem;margin-left:5px}
.rrow .ri{font-variant-numeric:tabular-nums;text-align:right;min-width:2.6em}
.rrow .ri.low{color:var(--bad)}
.rrow .ra{font-variant-numeric:tabular-nums;text-align:right;color:var(--accent-2);min-width:2.4em}
.rrow .ru{font-weight:700;color:var(--good);text-align:right;font-size:.74rem}
.rrow.idle{opacity:.55}
.more{display:block;width:100%;background:none;border:none;border-top:1px dashed var(--line);padding:4px 10px;font-family:var(--mono);font-size:.66rem;color:var(--muted);text-align:center}
.more:hover{color:var(--accent)}

/* schedule */
.swrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.s{border-collapse:collapse;width:100%;min-width:820px}
table.s th{font-family:var(--display);font-weight:600;font-size:.9rem;text-align:left;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--line)}
table.s td{padding:4px 8px;border-bottom:1px solid var(--line);font-size:.78rem;white-space:nowrap}
table.s tr.today td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
table.s tr.reset td{border-top:2px solid var(--line)}
table.s td.d{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
table.s td.d b{color:var(--ink);font-weight:500;margin-right:6px;display:inline-block;width:2.9em}
table.s td.pl{font-weight:600;color:var(--ink)}
.av{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.72rem;font-weight:500}
.av.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.av.part{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.av.yes{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.av.unk{color:var(--muted)}
table.s input{font-size:.74rem;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 4px;max-width:150px}
table.s button.av{border:1px solid transparent;font-family:var(--body);text-align:center;width:100%;min-width:8.5em;max-width:11em;padding:1px 6px;border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.s button.av.unk{background:transparent}
table.s button.av:hover{border-color:var(--line)}
sup.nc.no{color:var(--bad)}
sup.nc{font-family:var(--mono);font-size:.5rem;font-weight:400;color:var(--warn);margin-left:1px;vertical-align:.5em;line-height:0}
.menu .pre{display:flex;align-items:center;gap:2px}
.menu .pre button{display:block}
.menu .pre button:first-child{flex:1}
.menu .pre .av{font-size:.74rem}
.menu .pre .x{width:26px;flex:none;text-align:center;color:var(--muted);padding:4px 0}
.menu .pre .x:hover{color:var(--bad)}
.menu .custom{display:block;width:calc(100% - 8px);margin:6px 4px 2px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:.78rem}
.menu .custom:focus{outline:none;border-color:var(--accent)}
.rt{font-weight:700}.rt.ra{color:var(--good)}.rt.rb{color:var(--bb)}.rt.r8{color:var(--bad)}
table.s input{max-width:150px}

/* char menu */
.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:220px;max-height:min(420px,70vh);overflow:auto}
.menu .mh{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 8px}
.menu button{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:4px 8px;font-size:.8rem}
.menu button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.menu button.cur{color:var(--accent);font-weight:600}
.menu .tone.none{background:transparent;border:1px solid var(--muted)}
.menu button.act{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:7px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:12px;border-radius:3px;background:var(--g2);border:1px solid var(--line)}
.proto{font-size:.72rem;color:var(--muted);margin-top:18px}

@media (max-width:1100px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.roster{grid-template-columns:minmax(0,1fr)}.tools{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar"><div class="topbar-in">
  <h1>The Static Board</h1>
  <nav class="tabs" role="tablist">
    <button class="tabbtn active" data-tab="board" id="tab-board">Board</button>
    <button class="tabbtn" data-tab="roster" id="tab-roster">Roster</button>
    <button class="tabbtn" data-tab="schedule" id="tab-schedule">Schedule</button>
  </nav>
  <div class="tools">
    <span class="stamp" id="stamp" title="When item levels were last read from lostark.bible"></span>
    <span id="lockform" hidden><input id="passin" type="password" autocomplete="off" placeholder="Passcode" aria-label="Passcode for editing"><button class="chipbtn" id="passgo">OK</button></span>
    <button class="chipbtn" id="editbtn">Edit</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<div class="menu" id="menu" hidden></div>

let S, edit = false, tab = "board";

function load(){
  S = JSON.parse(JSON.stringify(SHEET));
  try { const s = JSON.parse(localStorage.getItem(LS)||"null"); if (s){ S.blocks = s.blocks; S.days = s.days; if (s.presets) S.presets = s.presets; } } catch(e){}

// Hosted version: shared data in Supabase (REST, polled every 8 s). Viewing needs nothing; Edit needs the group passcode.
// Records: board/current (passcode) · plan/<date> (passcode) · clears/<week>_<party> · avail/<date>_<player> · presets/h<hash> (anyone)
// · stats/<roster> (written by the GitHub job from lostark.bible).
const SB = {"url": "https://gaobuwothhhimqvbmcas.supabase.co", "key": "sb_publishable_j1SEX_u-lU_NYVWcxQ4kUg_xe7e8GT9"};
const SEED = JSON.parse(JSON.stringify(SHEET));     // the sheet, shown until the board is first saved
const DEFAULT_PRESETS = ["Not Available", "Until 19:00", "After 17:00"];
let pass = ""; try { pass = localStorage.getItem("static-board:pass") || ""; } catch(e){}
let rows = [], unlocked = false, inflight = 0, lastWrite = 0, fails = 0, statsAt = 0;
const hdr = write => Object.assign({apikey: SB.key, Authorization: "Bearer " + SB.key, "Content-Type": "application/json"}, write && pass ? {"x-passcode": pass} : {});
const fold = t => String(t||"").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fnv = t => { let h = 0x811c9dc5; for (const ch of t){ h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); };

// Lost Ark EU weekly reset: Wednesday 10:00 UTC. Clears are stored per week, so each week starts empty.
function weekKey(now = new Date()){
  const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 10));
  while (d.getUTCDay() !== 3 || d > now) d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString().slice(0, 10);
}

function toast(msg, bad){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, bad ? 6000 : 3000);
}
function stamp(){
  const el = document.getElementById("stamp"); if (!el) return;
  el.textContent = statsAt ? "lostark.bible " + new Date(statsAt).toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
}

function rebuild(){
  const by = c => rows.filter(r=>r.coll===c);
  const boardRow = rows.find(r=>r.coll==="board" && r.id==="current"), seeded = !!boardRow;
  const base = upgrade({blocks: JSON.parse(JSON.stringify(seeded ? boardRow.data.blocks || [] : SEED.blocks))});
  const wk = weekKey(), clears = {};
  by("clears").forEach(r=>{ if (r.id.startsWith(wk + "_")) clears[r.id.slice(wk.length + 1)] = r.data; });
  for (const b of base.blocks) for (const p of b.parties) for (const r of p.runs)
    r.done = clears[p.uid] ? !!clears[p.uid][r.k] : (!seeded && !!r.done);
  // three weeks from the last Wednesday, like the Schedule tab shows
  const plan = {}, av = {};
  by("plan").forEach(r=>{ plan[r.id] = r.data.t || ""; });
  by("avail").forEach(r=>{ (av[r.id.slice(0,10)] ??= {})[r.id.slice(11)] = r.data.v; });
  const sheetDays = Object.fromEntries(SEED.days.map(d=>[d.date, d]));
  const today = new Date(); today.setHours(0,0,0,0);
  const wed = new Date(today); wed.setDate(today.getDate() - ((today.getDay()+4)%7));
  const days = [];
  for (let k = 0; k < 21; k++){
    const dt = new Date(wed); dt.setDate(wed.getDate() + k); const ds = iso(dt);
    days.push(seeded ? {date: ds, plan: plan[ds] || "", st: av[ds] || {}}
                     : {date: ds, plan: plan[ds] ?? sheetDays[ds]?.plan ?? "", st: Object.assign({}, sheetDays[ds]?.st, av[ds])});
  }
  const pr = by("presets").sort((a,b)=>(a.data.at||0)-(b.data.at||0)).map(r=>r.data.v);
  // lostark.bible numbers from the GitHub job override the ones baked into the page
  statsAt = 0;
  const stats = {};
  by("stats").forEach(r=>{ statsAt = Math.max(statsAt, r.data.at || 0); (r.data.chars || []).forEach(c=>{ (stats[fold(c.name)] ??= []).push(Object.assign({alt: r.data.alt ? (r.data.world || true) : false}, c)); }); });
  for (const c of SHEET.chars){
    const hit = (stats[fold(c.name)] || []).filter(x=>x.cls === c.cls.replace(" ⚔️",""));
    const x = hit.find(h=>h.name.toLowerCase() === c.name.toLowerCase()) || (hit.length === 1 ? hit[0] : null);
    if (x){ c.il = x.il; c.cp = x.cp; if (x.alt) c.alt = x.alt; }
  }
  S = {blocks: base.blocks, days, presets: seeded || pr.length ? pr : DEFAULT_PRESETS.slice()};
}

const busy = () => !menu.hidden || drag || (document.activeElement && document.activeElement.matches("input, select, textarea"));
function poll(){
  const t0 = Date.now();
  return fetch(SB.url + "/rest/v1/docs?select=coll,id,data", {headers: hdr()})
    .then(r=>{ if (!r.ok) throw r.status; return r.json(); })
    .then(data=>{ fails = 0; if (inflight || lastWrite > t0) return; rows = data; if (busy()) return; rebuild(); render(); stamp(); },
          ()=>{ if (++fails === 3) toast("Lost the connection to the shared data. Still retrying.", true); });
}
function send(method, path, body){
  inflight++;
  return fetch(SB.url + "/rest/v1/" + path, {method, headers: Object.assign(hdr(true), {Prefer: method === "POST" ? "resolution=merge-duplicates,return=minimal" : "return=minimal"}), body: body ? JSON.stringify(body) : undefined})
    .then(r=>{ if (!r.ok) throw r.status; })
    .catch(st=>{
      if (st === 401 || st === 403){ unlocked = false; edit = false; toast("Not saved: the passcode was not accepted. Click Edit and enter it again.", true); }
      else toast("Not saved: could not reach the shared data. Try again in a moment.", true);
    })
    .finally(()=>{ inflight--; lastWrite = Date.now(); setTimeout(poll, 400); });
}
const put = (coll, id, data) => send("POST", "docs", [{coll, id, data, updated_at: new Date().toISOString()}]);
const del = (coll, id) => send("DELETE", `docs?coll=eq.${encodeURIComponent(coll)}&id=eq.${encodeURIComponent(id)}`);
const boardData = () => ({blocks: S.blocks.map(b=>({id: b.id, size: b.size, cols: b.cols,
  parties: b.parties.map(p=>({uid: p.uid, members: p.members, group2: p.group2, runs: p.runs.map(r=>({k: r.k}))}))}))});
const clearData = p => Object.fromEntries(p.runs.map(r=>[r.k, !!r.done]));

// first unlock with an empty database: save the sheet's board, plans, notes and this week's clears
function seed(){
  const now = new Date().toISOString(), wk = weekKey(), out = [{coll: "board", id: "current", data: boardData(), updated_at: now}];
  S.blocks.forEach(b=>b.parties.forEach(p=>{ if (p.runs.some(r=>r.done)) out.push({coll: "clears", id: wk + "_" + p.uid, data: clearData(p), updated_at: now}); }));
  SEED.days.forEach(d=>{
    if (d.plan) out.push({coll: "plan", id: d.date, data: {t: d.plan}, updated_at: now});
    Object.entries(d.st).forEach(([p, v])=>{ if (v) out.push({coll: "avail", id: d.date + "_" + p, data: {v: String(v).slice(0,16)}, updated_at: now}); });
  });
  S.presets.forEach((v, k)=>out.push({coll: "presets", id: "h" + fnv(v), data: {v, at: Date.now() + k}, updated_at: now}));
  return send("POST", "docs", out).then(()=>toast("Board saved to the shared database."));
}

function checkPass(p){
  return fetch(SB.url + "/rest/v1/rpc/pass_ok", {method: "POST", headers: Object.assign(hdr(), {"x-passcode": p}), body: "{}"})
    .then(r=>r.json()).then(ok=>ok === true, ()=>false);
}
let askResolve = null;
function ask(){
  const f = document.getElementById("lockform"); f.hidden = false; document.getElementById("passin").focus();
  return new Promise(res=>{ askResolve = res; });
}
function tryPass(){
  const inp = document.getElementById("passin"), p = inp.value.trim(); if (!p) return;
  checkPass(p).then(ok=>{
    if (!ok){ toast("That passcode is not right. Check it and try again.", true); inp.select(); return; }
    pass = p; unlocked = true; try { localStorage.setItem("static-board:pass", p); } catch(e){}
    document.getElementById("lockform").hidden = true; inp.value = "";
    toast("Editing unlocked on this device.");
    if (askResolve){ askResolve(true); askResolve = null; }
    if (!rows.some(r=>r.coll==="board" && r.id==="current")) seed();
  });
}
document.getElementById("passgo").addEventListener("click", tryPass);
document.getElementById("passin").addEventListener("keydown", e=>{ if (e.key === "Enter") tryPass(); if (e.key === "Escape"){ document.getElementById("lockform").hidden = true; if (askResolve){ askResolve(false); askResolve = null; } } });

const STORE = {
  start(){
    rebuild(); render();
    if (/PROJECT|PLACEHOLDER/.test(SB.url + SB.key)){ toast("Not connected to the shared database yet. Showing the sheet."); STORE.unlock = ()=>Promise.resolve(false); return; }
    poll(); setInterval(()=>{ if (!document.hidden) poll(); }, 8000);
    document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) poll(); });
  },
  unlock(){
    if (unlocked) return Promise.resolve(true);
    if (pass) return checkPass(pass).then(ok=>{ if (ok){ unlocked = true; if (!rows.some(r=>r.coll==="board" && r.id==="current")) seed(); return true; } return ask(); });
    return ask();
  },
  board(){ put("board", "current", boardData()); },
  clear(p){ put("clears", weekKey() + "_" + p.uid, clearData(p)); },
  plan(i){ const d = S.days[i]; d.plan ? put("plan", d.date, {t: d.plan.slice(0, 80)}) : del("plan", d.date); },
  avail(i, p){ const d = S.days[i], v = d.st[p]; v ? put("avail", d.date + "_" + p, {v: v.slice(0, 16)}) : del("avail", d.date + "_" + p); },
  presetAdd(v){ put("presets", "h" + fnv(v), {v, at: Date.now()}); },
  presetDel(v){ del("presets", "h" + fnv(v)); },
};

const CH = Object.fromEntries(SHEET.chars.map(c=>[c.id,c]));
const esc = s => String(s??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const clsLabel = c => c.cls.replace(" ⚔️"," DPS").replace("Warpbeaver","Dimensionalist");
const icon = (c, size="") => `<span class="ic ${size} s-${syn(c.cls)}" title="${esc(clsLabel(c))}${SYN[syn(c.cls)]?" · "+SYN[syn(c.cls)][0]:""}">${ICONS[c.cls]?`<img src="${ICONS[c.cls]}" alt="${esc(clsLabel(c))}">`:""}</span>`;
// second roster: tiny superscript "2" after the name
const altMark = c => c.alt ? `<sup class="alt" title="Second roster${typeof c.alt==="string"?" · "+esc(c.alt):""}">2</sup>` : "";
const nm = c => esc(c.name || clsLabel(c)) + altMark(c);
const il = c => Math.floor(c.il);
const cp = c => c.cp ? c.cp.toFixed(0) : "";
// Runs a party can do. 4-man rows: Serca (Hard or Nightmare) and/or Cathedral 3. 8-man rows: one of Kazeros Hard or Belgardin.
const RUNS = {
  SercaHM: {name:"Serca Hard", tag:"HM", art:"Serca", tone:"hm", il:1730},
  SercaNM: {name:"Serca Nightmare", tag:"NM", art:"Serca", tone:"nm", il:1740},
  Cath3:   {name:"Cathedral 3", tag:"C3", art:"Cathedral", tone:"c3", il:1750},
  KazerosHM: {name:"Kazeros Hard", tag:"HM", art:"Kazeros", tone:"hm", il:1700},
  BelgN:   {name:"Belgardin Normal", tag:"N", art:"Belgardin", tone:"nr", il:1750},
  BelgHM:  {name:"Belgardin Hard", tag:"HM", art:"Belgardin", tone:"hm", il:1770},
  BelgNM:  {name:"Belgardin Nightmare", tag:"NM", art:"Belgardin", tone:"nm", il:1780}};
const EIGHT = ["KazerosHM","BelgN","BelgHM","BelgNM"];
const rowGate = p => Math.max(0, ...p.runs.map(r=>RUNS[r.k].il));
function upgrade(s){   // sheet / older saves: block raid + done[] -> party.runs
  for (const b of s.blocks) b.cols ??= PLAYERS.filter(pl => b.parties.some(p => p.members[pl]));
  for (const b of s.blocks) for (const p of b.parties) for (const r of p.runs || []) if (r.k === "Kazeros") r.k = "KazerosHM";
  for (const b of s.blocks) b.parties.forEach((p,i)=>{ p.uid ??= (b.size===8 ? "8M" : b.id) + (i+1); });
  for (const b of s.blocks) for (const p of b.parties) if (!p.runs){
    p.runs = b.size===8 ? [{k:"KazerosHM", done:!!p.done?.[0]}] : [{k:"SercaHM", done:!!p.done?.[0]}, {k:"Cath3", done:!!p.done?.[1]}];
    delete p.done;
  }
  return s;
}
const plabel = (b, pi) => (b.size===8 ? "8M" : b.id) + "." + (pi+1);   // A.1, B.3, 8M.2: always from row order
const newParty = b => ({uid: Math.random().toString(36).slice(2,10), members:{}, group2:[], runs: b.size===8 ? [{k:"KazerosHM", done:false}] : [{k:"SercaHM", done:false}, {k:"Cath3", done:false}]});
const isDone = p => p.runs.length && p.runs.every(r=>r.done);
const blockPlayers = b => PLAYERS.filter(pl => b.cols.includes(pl) || b.parties.some(p => p.members[pl]));

/* ---------- board ---------- */
function weekStrip(){
  const today = new Date(); today.setHours(0,0,0,0);
  const plan = S.days.find(d => d.date >= iso(today) && d.plan);
  // runs cleared / runs scheduled, per group
  let h = S.blocks.map(b=>{ const runs = b.parties.flatMap(p=>p.runs), n = runs.filter(r=>r.done).length, t = runs.length;
    return `<div class="wk"><span class="k">${b.size===8?"8-man":"Group "+esc(b.id)}</span><span class="v num">${n}/${t}<small>runs</small></span><span class="bar"><i style="width:${t?n/t*100:0}%"></i></span></div>`; }).join("");
  if (plan) h += `<div class="wk next"><span class="k">Next run · ${dayName(plan.date)} ${plan.date.slice(8)}.${plan.date.slice(5,7)}</span><span class="v">${planHtml(plan.plan)}</span></div>`;
  return `<div class="week">${h}</div>`;
}
function cellInner(c, g){
  if (!c) return "";
  return `${icon(c)}<span class="tx"><span class="nm">${nm(c)}${c.support?'<i class="sup" title="Support"></i>':""}</span><span class="sub"><span class="il${g&&c.il<g?" low":""}" ${g&&c.il<g?`title="Under ${g}"`:""}>${il(c)}</span>${c.cp?`<span class="cp">${cp(c)}</span>`:""}</span></span>`;
}
function artCell(b, bi, pi, p){
  const tiles = p.runs.map(r=>`<i class="art-${RUNS[r.k].art}"></i>`).join("") || `<i class="art-none"></i>`;
  const title = p.runs.map(r=>RUNS[r.k].name).join(" + ") || "No runs";
  return `<button class="art" style="--n:${Math.max(1,p.runs.length)}" data-runs="${bi}.${pi}" ${edit?"":"disabled"} title="${esc(title)}"><span class="strip">${tiles}</span><span class="pid">${esc(plabel(b,pi))}</span></button>`;
}
function checks(bi, pi, p){
  return `<div class="ckw">${p.runs.map((r,ri)=>{ const R = RUNS[r.k];
    return `<button data-ck="${bi}.${pi}.${ri}" class="${R.tone}${r.done?" on":""}" title="${esc(R.name)}: ${r.done?"cleared":"not cleared"}" aria-pressed="${r.done}">${r.done?"✓":esc(R.tag)}</button>`; }).join("")}</div>`;
}
function gridBlock(b, bi){
  const pls = blockPlayers(b);
  const head = `<tr>${edit?`<th class="hd"></th>`:""}<th>Run</th>${pls.map(p=>`<th>${esc(p)}</th>`).join("")}<th class="c">Clear</th>${edit?`<th class="hd"></th>`:""}</tr>`;
  const rows = b.parties.map((p,pi)=>`<tr class="${isDone(p)?"done":""}" data-row="${bi}.${pi}">${edit?`<td class="hd"><span class="grip" data-drag="${bi}.${pi}" title="Drag to reorder" aria-label="Drag ${esc(plabel(b,pi))}">⠿</span></td>`:""}<td class="artc">${artCell(b,bi,pi,p)}</td>${pls.map(pl=>{
      const c = CH[p.members[pl]], g2 = b.size===8 && p.group2.includes(pl);
      return `<td><button class="cell${c?"":" empty"}${g2?" g2":""}" data-cell="${bi}.${pi}.${esc(pl)}" ${edit?"":"disabled"}>${c?cellInner(c,rowGate(p)):(edit?"+":"")}</button></td>`;
    }).join("")}<td class="ck">${checks(bi,pi,p)}</td>${edit?`<td class="hd"><button class="del" data-del="${bi}.${pi}" title="Delete ${esc(plabel(b,pi))}">×</button></td>`:""}</tr>`).join("");
  const add = edit ? `<button class="addrow" data-add="${bi}" id="add-${bi}">+ Add run</button>` : "";
  return `<div class="gwrap"><table class="g${b.size===8?" fixed":""}${edit?" editing":""}">${head}${rows}</table></div>${add}`;
}
function board(){
  let h = weekStrip();
  h += `<div class="legend"><span><i class="sup"></i> support</span><span><i class="sw"></i> second party in an 8-player group</span><span><sup class="alt">2</sup> second roster</span></div>`;
  S.blocks.forEach((b,bi)=>{
    const title = b.size===8 ? "8-man" : "Group "+b.id;
    h += `<section class="block"><div class="block-h"><h2>${esc(title)}</h2><span class="meta">${b.parties.length} runs · ${b.size} players</span></div>${gridBlock(b,bi)}</section>`;
  });
  return h;
}

/* ---------- roster ---------- */
function roster(){
  const used = {};
  S.blocks.forEach(b=>b.parties.forEach(p=>Object.values(p.members).forEach(id=>used[id]=(used[id]||0)+1)));
  return `<div class="roster">${PLAYERS.map(pl=>{
    // top 6: characters in board runs first, then item level, then alphabetical
    const cs = SHEET.chars.filter(c=>c.player===pl).sort((a,b)=>(used[b.id]?1:0)-(used[a.id]?1:0) || Math.floor(b.il)-Math.floor(a.il) || nm(a).localeCompare(nm(b)));
    const open = rosterOpen.has(pl), shown = open ? cs : cs.slice(0,6), more = cs.length - 6;
    return `<div class="pgroup"><div class="pname">${esc(pl)}<small>${cs.length} chars</small></div>${shown.map(c=>
      `<div class="rrow${used[c.id]?"":" idle"}">${icon(c,"sm")}<span class="rn">${nm(c)}${c.support?'<i class="sup"></i>':""}</span><span class="ri num">${il(c)}</span><span class="ra num">${cp(c)}</span><span class="ru num">${used[c.id]||""}</span></div>`).join("")}${more>0?`<button class="more" data-more="${esc(pl)}" id="more-${esc(pl)}">${open?"Show top 6":`+${more} more`}</button>`:""}</div>`;
  }).join("")}</div><p class="proto">Item level · combat power (gold, from lostark.bible where pulled) · parties this character is in (green).</p>`;
}

/* ---------- schedule ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayName = s => ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(s+"T12:00").getDay()];
// availability is free text (16 chars); its colour is guessed from the words
const avKind = v => !v ? "unk" : /\b(not?|out|off|busy|away)\b/i.test(v) ? "no" : /\b(all|free|yes|any)\b/i.test(v) ? "yes" : "part";
// run plan colours (as in Aleks's sheet): time plain, 8man red, A runs green, B runs blue; each stops at the next space
const planHtml = t => esc(t)
  .replace(/\b8\s?man\b/gi, m=>`<b class="rt r8">${m}</b>`)
  .replace(/(^|\s)(A(?:[.\d][^\s<]*)?)(?=\s|$)/g, '$1<b class="rt ra">$2</b>')
  .replace(/(^|\s)(B(?:[.\d][^\s<]*)?)(?=\s|$)/g, '$1<b class="rt rb">$2</b>');
// availability: each player sets their own, no Edit mode needed
const avSelect = (d, i, p) => `<button class="av ${avKind(d.st[p])}" id="av-${i}-${p}" data-av="${i}" data-p="${esc(p)}" aria-label="${esc(p)} ${esc(d.date)}: ${esc(d.st[p]||"no note")}">${esc(d.st[p]||"·")}</button>`;
const noteCount = d => Object.values(d.st).filter(Boolean).length;
function schedule(){
  const today = new Date(); today.setHours(0,0,0,0);
  const wed = new Date(today); wed.setDate(today.getDate() - ((today.getDay()+4)%7));   // weekly reset: Wednesday
  const from = iso(wed), until = iso(new Date(wed.getTime()+21*864e5));
  const rows = S.days.map((d,i)=>[d,i]).filter(([d])=>d.date>=from && d.date<until);
  return `<div class="swrap"><table class="s"><tr><th>Day</th><th>Run</th>${PLAYERS.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>${rows.map(([d,i])=>{
    const cls = [d.date===iso(today)?"today":"", dayName(d.date)==="Wed"&&d.date!==from?"reset":""].join(" ");
    return `<tr class="${cls}"><td class="d"><b>${dayName(d.date)}${noteCount(d)?`<sup class="nc${Object.values(d.st).some(v=>avKind(v)==="no")?" no":""}" title="${noteCount(d)} with a note">${noteCount(d)}</sup>`:""}</b>${d.date.slice(8)}.${d.date.slice(5,7)}</td><td class="pl">${edit?`<input id="plan-${i}" data-plan="${i}" value="${esc(d.plan)}" placeholder="—">`:planHtml(d.plan)}</td>${PLAYERS.map(p=>`<td>${avSelect(d,i,p)}</td>`).join("")}</tr>`; }).join("")}</table></div><p class="proto">Three weeks from the last Wednesday reset. Today is shaded.</p>`;
}

/* ---------- menu ---------- */
const menu = document.getElementById("menu");
function openMenu(el){
  const [bi,pi,pl] = el.dataset.cell.split("."); const b = S.blocks[bi], p = b.parties[pi];
  const cs = SHEET.chars.filter(c=>c.player===pl).sort((a,b)=>b.il-a.il);

function openRunMenu(el){

  menu.innerHTML = b.size===8
    ? `<div class="mh">${esc(plabel(b,+pi))} · Kazeros</div>${opt("KazerosHM",has("KazerosHM"),"Hard · 1700")}<div class="mh">Belgardin</div>${opt("BelgN",has("BelgN"),"Normal · 1750")}${opt("BelgHM",has("BelgHM"),"Hard · 1770")}${opt("BelgNM",has("BelgNM"),"Nightmare · 1780")}`
    : `<div class="mh">${esc(plabel(b,+pi))} · Serca</div>${opt("SercaHM",has("SercaHM"),"Hard · 1730")}${opt("SercaNM",has("SercaNM"),"Nightmare · 1740")}${opt("",!has("SercaHM")&&!has("SercaNM"),"No Serca")}<div class="mh">Cathedral</div>${opt("Cath3",has("Cath3"),"Level 3 · 1750")}`;

}
function openAvMenu(el){
  const i = +el.dataset.av, p = el.dataset.p, cur = S.days[i].st[p] || "";
  menu.innerHTML = `<div class="mh">${esc(p)} · ${dayName(S.days[i].date)} ${S.days[i].date.slice(8)}.${S.days[i].date.slice(5,7)}</div>`

    + `<input id="av-custom" class="custom" maxlength="16" placeholder="Type a note, Enter" value="${esc(S.presets.includes(cur)?"":cur)}" autocomplete="off" spellcheck="false">`

function setAv(i, p, v){
  v = (v || "").trim().slice(0,16);
  if (v) S.days[i].st[p] = v; else delete S.days[i].st[p];
  STORE.avail(i, p);
  if (v && !S.presets.includes(v)){ S.presets.push(v); STORE.presetAdd(v); }   // custom notes become quick choices
  menu.hidden = true; render();
}
menu.addEventListener("keydown", e=>{
  if (e.key==="Enter" && e.target.id==="av-custom" && menu._t?.av){ const {i,p} = menu._t.av; setAv(i, p, e.target.value); }
});
menu.addEventListener("click", e=>{
  if (menu._t?.av){
    const {i,p} = menu._t.av, b = e.target.closest("button"); if (!b) return;
    if ("avset" in b.dataset) setAv(i, p, b.dataset.avset);
    else if ("avdel" in b.dataset){ const gone = S.presets.splice(+b.dataset.avdel, 1)[0]; STORE.presetDel(gone); openAvMenu(app.querySelector(`[data-av="${i}"][data-p="${p}"]`)); }
    else if (b.dataset.avclear) setAv(i, p, "");
    return;
  }
  const t = menu._t, btn = e.target.closest("button"); if (!btn || !t) return;
  if (t.run){
    const p = t.run, k = btn.dataset.run, serca = p.runs.find(r=>r.k.startsWith("Serca"));
    if (EIGHT.includes(k)){ if (p.runs[0]?.k !== k) p.runs = [{k, done:false}]; }   // 8-man: one run per row
    else if (k === "Cath3"){ const i = p.runs.findIndex(r=>r.k==="Cath3"); i>=0 ? p.runs.splice(i,1) : p.runs.push({k:"Cath3", done:false}); }
    else if (!k){ if (serca) p.runs.splice(p.runs.indexOf(serca),1); }
    else if (serca) serca.k = k;
    else p.runs.unshift({k, done:false});
    STORE.board(); render(); openRunMenu(app.querySelector(`[data-runs="${S.blocks.findIndex(b=>b.parties.includes(p))}.${S.blocks.find(b=>b.parties.includes(p)).parties.indexOf(p)}"]`));
    return;
  }
  if (btn.dataset.swapgrp){ const i = t.p.group2.indexOf(t.pl); i>=0 ? t.p.group2.splice(i,1) : t.p.group2.push(t.pl); }
  else if ("pick" in btn.dataset){
    const id = btn.dataset.pick;
    if (!id){ delete t.p.members[t.pl]; }
    else {
      // one party per character per block: swap with the party that already has it
      const other = t.b.parties.find(x=>x!==t.p && x.members[t.pl]===id);
      if (other){ if (t.p.members[t.pl]) other.members[t.pl] = t.p.members[t.pl]; else delete other.members[t.pl]; }
      t.p.members[t.pl] = id;
    }
  }
  menu.hidden = true; STORE.board(); render();
});
document.addEventListener("click", e=>{ if (!menu.hidden && !menu.contains(e.target) && !e.target.closest("[data-cell],[data-runs],[data-av]")) menu.hidden = true; });
document.addEventListener("keydown", e=>{ if (e.key==="Escape") menu.hidden = true; });

/* ---------- wiring ---------- */
const app = document.getElementById("app");
function render(){
  document.body.classList.toggle("edit", edit);
  document.querySelectorAll(".tabbtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  document.getElementById("editbtn").classList.toggle("on", edit);
  document.getElementById("editbtn").textContent = edit ? "Done" : "Edit";
  const rb = document.getElementById("resetbtn"); if (rb) rb.hidden = !edit;
  app.innerHTML = tab==="board" ? board() : tab==="roster" ? roster() : schedule();
}
document.querySelector(".tabs").addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if (b){ tab = b.dataset.tab; render(); }});
document.getElementById("editbtn").addEventListener("click", ()=>{
  menu.hidden = true;
  if (edit){ edit = false; render(); return; }
  STORE.unlock().then(ok=>{ if (ok){ edit = true; render(); } });   // hosted: asks for the passcode once per device
});
document.getElementById("resetbtn")?.addEventListener("click", e=>{
  const b = e.currentTarget;
  if (b.dataset.arm){ try{localStorage.removeItem(LS)}catch(_){} load(); delete b.dataset.arm; b.textContent="Reset to sheet"; render(); return; }
  b.dataset.arm = 1; b.textContent = "Click again to reset"; setTimeout(()=>{ delete b.dataset.arm; b.textContent="Reset to sheet"; }, 3000);
});
app.addEventListener("click", e=>{
  const mo = e.target.closest("[data-more]");
  if (mo){ const pl = mo.dataset.more; rosterOpen.has(pl) ? rosterOpen.delete(pl) : rosterOpen.add(pl); render(); return; }
  const av = e.target.closest("[data-av]");    // availability: anyone, any time
  if (av){ e.stopPropagation(); openAvMenu(av); return; }
  const ck = e.target.closest("[data-ck]");   // clears: anyone, any time
  if (ck){ const [bi,pi,ci] = ck.dataset.ck.split(".").map(Number); const pa = S.blocks[bi].parties[pi], r = pa.runs[ci]; r.done = !r.done; STORE.clear(pa); render(); return; }
  if (!edit) return;
  const ad = e.target.closest("[data-add]");
  if (ad){ const b = S.blocks[ad.dataset.add]; b.parties.push(newParty(b)); STORE.board(); render(); return; }
  const dl = e.target.closest("[data-del]");
  if (dl){
    if (!dl.dataset.arm){ dl.dataset.arm = 1; dl.textContent = "Delete?"; dl.classList.add("arm"); setTimeout(()=>{ if (dl.isConnected){ delete dl.dataset.arm; dl.textContent = "×"; dl.classList.remove("arm"); } }, 3000); return; }
    const [bi,pi] = dl.dataset.del.split(".").map(Number); S.blocks[bi].parties.splice(pi,1); STORE.board(); render(); return;
  }
  const ar = e.target.closest("[data-runs]"); if (ar){ e.stopPropagation(); openRunMenu(ar); return; }
  const cell = e.target.closest("[data-cell]"); if (cell) { e.stopPropagation(); openMenu(cell); }
});
let drag = null;
app.addEventListener("pointerdown", e=>{
  const g = e.target.closest("[data-drag]"); if (!g || !edit) return;
  e.preventDefault(); g.setPointerCapture(e.pointerId);
  const [bi,pi] = g.dataset.drag.split(".").map(Number), rows = [...g.closest("table").querySelectorAll("tr[data-row]")];
  rows[pi].classList.add("dragging"); drag = {bi, from:pi, to:pi, rows};
});
app.addEventListener("pointermove", e=>{
  if (!drag) return;
  // new position = number of other rows whose middle is above the pointer
  const others = drag.rows.filter((_,i)=>i!==drag.from);
  drag.to = others.filter(r=>{ const q = r.getBoundingClientRect(); return e.clientY > q.top + q.height/2; }).length;
  drag.rows.forEach(r=>r.classList.remove("drop-above","drop-below"));
  if (drag.to !== drag.from){ if (drag.to < others.length) others[drag.to].classList.add("drop-above"); else others[others.length-1].classList.add("drop-below"); }
});
const endDrag = ()=>{
  if (!drag) return; const {bi, from, to} = drag; drag = null;
  if (to !== from){ const ps = S.blocks[bi].parties; ps.splice(to, 0, ps.splice(from, 1)[0]); STORE.board(); }
  render();
};
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", endDrag);
app.addEventListener("change", e=>{
  const t = e.target;
  if (t.dataset.plan){ S.days[t.dataset.plan].plan = t.value.trim(); STORE.plan(+t.dataset.plan); }
});
STORE.start();
</script>
